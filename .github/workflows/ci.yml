name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # moon.work makes the four modules one workspace, so one run at the root checks,
  # builds and tests all of them, on every backend and three OSes.
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/ drivers/*/docs/skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of a README and a skill into a project, so they have to
      # compile as written, against this commit's source. Each module checks its own.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: |
          for dir in . drivers/redis drivers/etcd drivers/consul; do
            (cd "$dir" && python3 scripts/check_snippets.py) || exit 1
          done

  # Redis 8 standalone, a cluster and a sentinel group, in containers.
  redis-live:
    name: moonredis (live Redis 8)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/redis
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      - name: start redis 8 (standalone, cluster, sentinel)
        run: |
          docker version
          bash scripts/start_redis.sh

      - name: moon test (native, against live Redis)
        env:
          MOONREDIS_LIVE: "1"
        run: moon test --target native

      - name: examples run
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

  # One etcd in the clear, two over TLS (one asks for a client certificate), then a
  # three-node cluster whose members the suite kills.
  etcd-live:
    name: moonetcd (live etcd 3.5)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/etcd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install etcd
        run: |
          ETCD_VERSION=v3.5.16
          ARCH=linux-amd64
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-${ARCH}.tar.gz" -o /tmp/etcd.tar.gz
          tar -xzf /tmp/etcd.tar.gz -C /tmp
          sudo install "/tmp/etcd-${ETCD_VERSION}-${ARCH}/etcd" /usr/local/bin/etcd
          sudo install "/tmp/etcd-${ETCD_VERSION}-${ARCH}/etcdctl" /usr/local/bin/etcdctl
          etcd --version
          etcdctl version

      - name: single-node etcd
        run: |
          mkdir -p /tmp/etcd-single
          nohup etcd --data-dir /tmp/etcd-single \
            --listen-client-urls http://127.0.0.1:2379 \
            --advertise-client-urls http://127.0.0.1:2379 \
            > /tmp/etcd-single.log 2>&1 &
          for _ in $(seq 1 30); do
            if etcdctl --endpoints=http://127.0.0.1:2379 endpoint health; then break; fi
            sleep 1
          done
          etcdctl --endpoints=http://127.0.0.1:2379 endpoint health

      - name: field numbers match etcd's .proto files
        run: python3 scripts/check_field_numbers.py "$ETCD_TAG"
        env:
          ETCD_TAG: v3.5.16

      - name: moon test (single node)
        env:
          MOONETCD_LIVE: "1"
        run: moon test --target native

      - name: members over TLS, and one that asks for a client certificate
        run: |
          bash scripts/etcd_tls.sh up /tmp/etcd-tls 23379
          bash scripts/etcd_tls.sh up /tmp/etcd-mtls 23380 --client-cert-auth \
            --certs /tmp/etcd-tls/certs

      - name: moon test (TLS, both transports)
        env:
          MOONETCD_LIVE: "1"
          MOONETCD_ENDPOINT: 127.0.0.1:23379
          MOONETCD_CA: /tmp/etcd-tls/certs/ca.crt
          MOONETCD_MTLS_ENDPOINT: 127.0.0.1:23380
          MOONETCD_MTLS_CERT: /tmp/etcd-tls/certs/client.crt
          MOONETCD_MTLS_KEY: /tmp/etcd-tls/certs/client.key
        run: moon test --target native

      - name: examples (single node)
        run: |
          for ex in 00-connect 01-kv 02-watch 03-lease 04-txn 05-lock 06-gateway; do
            echo "== $ex =="
            moon run --target native "src/examples/$ex"
          done

      - name: stop the single node and the TLS members
        run: |
          pkill -f 'etcd-single' || true
          bash scripts/etcd_tls.sh down /tmp/etcd-tls
          bash scripts/etcd_tls.sh down /tmp/etcd-mtls
          pkill -f 'etcd-tls' || true
          sleep 2

      - name: three-node etcd cluster
        run: |
          bash scripts/etcd_cluster.sh up
          etcdctl --endpoints=http://127.0.0.1:2379 member list
          members=$(etcdctl --endpoints=http://127.0.0.1:2379 member list --write-out=json | grep -o '"name"' | wc -l)
          test "$members" -eq 3

      - name: moon test (three-node cluster, members killed)
        env:
          MOONETCD_LIVE: "1"
          MOONETCD_MEMBERS: bash scripts/etcd_cluster.sh
        run: moon test --target native

      - name: cluster dump on failure
        if: failure()
        run: tail -n 50 /tmp/moonetcd-cluster/*.log || true

  # Two Consul agents in containers; a missing agent fails the suite instead of skipping it.
  consul-live:
    name: moonconsul (live Consul 1.20)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/consul
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      - name: start consul
        run: bash scripts/start_consul.sh

      - name: moon test (native, against live Consul)
        env:
          MOONCONSUL_LIVE: "1"
          MOONCONSUL_CONTAINER: consul-it
        run: moon test --target native -p moonbitstack/moonconsul/integration

      - name: examples run
        run: |
          for dir in src/examples/*/; do
            echo "== $dir =="
            moon run "$dir" --target native
          done
