name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  # The gate: format, check every target with warnings denied, build, test, and
  # confirm the public interface is stable (`moon info` leaves no diff).
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, macos-26, windows-2025 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: MoonBit version
        run: |
          moon version
          moon update
      - name: Format
        if: ${{ runner.os != 'Windows' }}
        run: |
          moon fmt
          git diff --exit-code
      - name: Check (all targets, warnings denied)
        run: moon check --target all --deny-warn
      - name: Build (all targets)
        run: moon build --target all
      - name: Test (all targets)
        run: moon test --target all
      - name: Interface
        if: ${{ runner.os != 'Windows' }}
        run: |
          moon info --target all
          git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # Integration: a real etcd, first as a single node, then again over TLS, then as a
  # three-node cluster, with the client tests and every example driven against it. Every
  # case runs over gRPC and over the HTTP/JSON gateway, and the answers are compared.
  integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update the registry index
        run: moon update
      - name: Install etcd
        run: |
          ETCD_VERSION=v3.5.16
          ARCH=linux-amd64
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-${ARCH}.tar.gz" -o /tmp/etcd.tar.gz
          tar -xzf /tmp/etcd.tar.gz -C /tmp
          sudo install "/tmp/etcd-${ETCD_VERSION}-${ARCH}/etcd" /usr/local/bin/etcd
          sudo install "/tmp/etcd-${ETCD_VERSION}-${ARCH}/etcdctl" /usr/local/bin/etcdctl
          etcd --version
          etcdctl version

      - name: Single-node etcd
        run: |
          mkdir -p /tmp/etcd-single
          nohup etcd --data-dir /tmp/etcd-single \
            --listen-client-urls http://127.0.0.1:2379 \
            --advertise-client-urls http://127.0.0.1:2379 \
            > /tmp/etcd-single.log 2>&1 &
          for _ in $(seq 1 30); do
            if etcdctl --endpoints=http://127.0.0.1:2379 endpoint health; then break; fi
            sleep 1
          done
          etcdctl --endpoints=http://127.0.0.1:2379 endpoint health

      - name: Field numbers match etcd's .proto files
        run: python3 scripts/check_field_numbers.py "$ETCD_TAG"
        env:
          ETCD_TAG: v3.5.16

      - name: Integration tests (single node)
        env:
          MOONETCD_LIVE: "1"
        run: moon test --target native

      - name: Members over TLS, and one that asks for a client certificate
        run: |
          bash scripts/etcd_tls.sh up /tmp/etcd-tls 23379
          bash scripts/etcd_tls.sh up /tmp/etcd-mtls 23380 --client-cert-auth \
            --certs /tmp/etcd-tls/certs

      # The same cases, both transports, over TLS: the CA is the only thing that lets the
      # client in, and the member on 23380 is reached with a client certificate.
      - name: Integration tests (TLS, both transports)
        env:
          MOONETCD_LIVE: "1"
          MOONETCD_ENDPOINT: 127.0.0.1:23379
          MOONETCD_CA: /tmp/etcd-tls/certs/ca.crt
          MOONETCD_MTLS_ENDPOINT: 127.0.0.1:23380
          MOONETCD_MTLS_CERT: /tmp/etcd-tls/certs/client.crt
          MOONETCD_MTLS_KEY: /tmp/etcd-tls/certs/client.key
        run: moon test --target native

      - name: Examples (single node)
        run: |
          for ex in 00-connect 01-kv 02-watch 03-lease 04-txn 05-lock 06-gateway; do
            echo "== $ex =="
            moon run --target native "src/examples/$ex"
          done

      - name: Stop the single node and the TLS members
        run: |
          pkill -f 'etcd-single' || true
          bash scripts/etcd_tls.sh down /tmp/etcd-tls
          bash scripts/etcd_tls.sh down /tmp/etcd-mtls
          pkill -f 'etcd-tls' || true
          sleep 2

      - name: Three-node etcd cluster
        run: |
          bash scripts/etcd_cluster.sh up
          etcdctl --endpoints=http://127.0.0.1:2379 member list
          members=$(etcdctl --endpoints=http://127.0.0.1:2379 member list --write-out=json | grep -o '"name"' | wc -l)
          test "$members" -eq 3

      - name: Integration tests (three-node cluster, members killed)
        env:
          MOONETCD_LIVE: "1"
          MOONETCD_MEMBERS: bash scripts/etcd_cluster.sh
        run: moon test --target native

      - name: Cluster dump on failure
        if: failure()
        run: tail -n 50 /tmp/moonetcd-cluster/*.log || true
